<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Questão 8</title>
  </head>
  <body>
    <h2>Cadastro de Cliente</h2>

    <form>
      Nome:
      <input type="text" />
      <br /><br />
      Pessoa:
      <input type="radio" name="tipo" onclick="fisica()" />
      Física
      <input type="radio" name="tipo" onclick="juridica()" />
      Jurídica
      <br /><br />
      CPF:
      <input type="text" id="cpf" disabled />
      <br /><br />
      CNPJ:
      <input type="text" id="cnpj" disabled />
      <br /><br />
      Data Nascimento:
      <input type="text" id="data" disabled />
      <br /><br />
      Endereço:
      <input type="text" />
      <br /><br />
      CEP:
      <input type="text" id="cep" oninput="somenteNumero(this)" />
      <br /><br />
      Telefone:
      <input type="text" />
      <br /><br />
      Email:
      <input type="email" />
    </form>

    <script>
      function fisica() {
        document.getElementById("cpf").disabled = false;
        document.getElementById("data").disabled = false;
        document.getElementById("cnpj").disabled = true;
      }
      function juridica() {
        document.getElementById("cnpj").disabled = false;
        document.getElementById("cpf").disabled = true;
        document.getElementById("data").disabled = true;
      }
      function somenteNumero(campo) {
        campo.value = campo.value.replace(/\D/g, "");
      }
    </script>
  </body>
</html>
