<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questão 2</title>
  </head>
  <body>
    <form>
      <button type="button" onmouseover="cor('red')">Vermelho</button>
      <button type="button" onmouseover="cor('green')">Verde</button>
      <button type="button" onmouseover="cor('blue')">Azul</button>
      <button type="button" onmouseover="cor('yellow')">Amarelo</button>
    </form>
    <script>
      function cor(corEscolhida) {
        document.body.style.backgroundColor = corEscolhida;
      }
    </script>
  </body>
</html>
